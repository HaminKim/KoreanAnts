name: Daily sync all_data_clean.csv

on:
  schedule:
    - cron: "0 16 * * *"   # 매일 KST 01:00 (UTC 16:00)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      # 1. 내 저장소 체크아웃
      - name: Checkout korean_ants
        uses: actions/checkout@v4

      # 2. 하민님 데이터 저장소 체크아웃 (CSV 가져오기용)
      - name: Checkout reant_streamlit
        uses: actions/checkout@v4
        with:
          repository: HaminKim/reant_streamlit
          path: reant_streamlit

      # 3. CSV 파일 복사
      - name: Copy all_data_clean.csv
        run: |
          mkdir -p processed
          cp reant_streamlit/processed/all_data_clean.csv processed/all_data_clean.csv

      # 4. CSV 변경사항 먼저 저장 (1차 커밋)
      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add processed/all_data_clean.csv

          if git diff --cached --quiet; then
            echo "No changes in CSV"
          else
            git commit -m "chore(data): sync all_data_clean.csv"
            git push
          fi

      # 5. 파이썬 설정
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6. 라이브러리 설치 (yfinance 포함 필수!)
      - name: Install deps
        run: |
          pip install pandas yfinance

      # 7. 주가 데이터 처리 & 흐름 분석 (요리 1단계)
      - name: Process Flow Data
        run: |
          python scripts/process_flow_data.py

      # 8. 최종 JSON 빌드 (요리 2단계)
      - name: Build JSON
        run: |
          python scripts/build_json.py

      # 9. [수정됨] 최종 결과물(JSON) 업로드 (순서: 커밋 -> 풀 -> 푸시)
      - name: Commit and push JSONs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # public/data 폴더의 모든 변경사항 담기
          git add public/data/

          # 변경사항 없으면 종료
          if git diff --cached --quiet; then
            echo "No changes in JSONs"
            exit 0
          fi

          # ⭐ 핵심 수정: 커밋을 먼저 해서 상태를 확정지음
          git commit -m "chore(data): update daily JSON files"

          # 그 다음 서버 변경사항 당겨오기 (Rebase)
          git pull --rebase

          # 최종 업로드
          git push