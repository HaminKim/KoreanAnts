name: Daily Sync & Analysis (KST)

on:
  schedule:
    # -----------------------------------------------------------
    # GitHub Actions는 UTC 기준입니다. (KST - 9시간)
    # -----------------------------------------------------------
    # 1. 01:00 KST (UTC 16:00) -> US 장 중 (Intraday)
    # 2. 06:00 KST (UTC 21:00) -> US 정규장 마감 (Market Close)
    # 3. 10:00 KST (UTC 01:00) -> US 애프터장 최종 마감 (Day End)
    - cron: "0 16,21,1 * * *"

    # 4. 09:00 KST (UTC 00:00) -> 한국장 시작 (KR Market Open)
    - cron: "0 0 * * *"

    # 5. 15:30 KST (UTC 06:30) -> 한국장 마감 (KR Market Close)
    - cron: "30 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    
    # ✨ [핵심] 서버 시간을 한국 시간(KST)으로 고정
    env:
      TZ: 'Asia/Seoul'

    steps:
      # 1. 내 저장소 체크아웃
      - name: Checkout korean_ants
        uses: actions/checkout@v4

      # 2. 하민님 데이터 저장소 체크아웃 (CSV 가져오기용)
      - name: Checkout reant_streamlit
        uses: actions/checkout@v4
        with:
          repository: HaminKim/reant_streamlit
          path: reant_streamlit

      # 3. CSV 파일 복사
      - name: Copy all_data_clean.csv
        run: |
          mkdir -p processed
          cp reant_streamlit/processed/all_data_clean.csv processed/all_data_clean.csv

      # 4. CSV 변경사항 먼저 저장 (1차 커밋)
      - name: Commit and push CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add processed/all_data_clean.csv

          if git diff --cached --quiet; then
            echo "No changes in CSV"
          else
            git commit -m "chore(data): sync all_data_clean.csv"
            # CSV 쪽도 혹시 몰라 충돌 방지 추가
            git pull --rebase -Xtheirs origin main
            git push
          fi

      # 5. 파이썬 설정
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 6. 라이브러리 설치
      - name: Install deps
        run: |
          pip install pandas numpy yfinance requests

      # ----------------------------------------------------------------
      # 🤖 새 종목 자동 감지 & 로고 자동화
      #    데이터 '보강' 단계이므로 실패해도 파이프라인을 막지 않는다
      #    (continue-on-error). 결과물(ticker_map.json, logos)은 아래
      #    "Commit and push JSONs" 스텝에서 함께 커밋된다.
      # ----------------------------------------------------------------

      # 6-A. CSV의 새 raw name → 티커 자동 매핑 (ticker_map.json 업데이트)
      - name: A. Auto-map new tickers
        continue-on-error: true
        run: python scripts/auto_new_tickers.py

      # 6-B. 로고 없는 종목 자동 다운로드 (public/logos/)
      - name: B. Fetch missing logos
        continue-on-error: true
        run: python scripts/fetch_logos.py

      # ----------------------------------------------------------------
      # 🍳 데이터 요리 시작
      # ----------------------------------------------------------------

      # 7-1. 기초 데이터 생성
      - name: 1. Process Flow Data (Base)
        run: python scripts/process_flow_data.py

      # 7-2. 놈놈놈 분석 & 타임머신 기록 저장 🕰️
      - name: 2. Generate NomNom & History
        run: python scripts/generate_nomnom.py

      # 7-3. 검색 인덱스 빌드
      - name: 3. Build Search Index
        run: python scripts/build_json.py

      # 7-4. 매일 브리핑 데이터 생성 (N8N 자동화용)
      - name: 4. Generate Daily Briefing for N8N
        run: python scripts/generate-daily.py

      # ✨ [NEW] 7-5. 섹터 그리드(트리맵) 데이터 생성
      # 사장님이 말씀하신 파일명(generate_sector.py)을 실행합니다!
      - name: 5. Generate Sector Data
        run: python scripts/generate_sector.py

      # 7-6. 워치리스트 히트맵 데이터 생성 (스탠 와인스타인 스테이지 분석)
      - name: 6. Generate Watchlist
        run: python scripts/generate_watchlist.py

      # 7-7. 코스피 워치리스트 히트맵 데이터 생성
      # if: always() → 앞 스텝 실패해도 반드시 실행
      - name: 7. Generate Watchlist KR
        if: always()
        run: |
          cp public/data/watchlist_kr.json public/data/watchlist_kr.json.bak 2>/dev/null || true
          python scripts/generate_watchlist_kr.py || {
            echo "⚠️ generate_watchlist_kr.py 실패 → 이전 데이터 복원"
            cp public/data/watchlist_kr.json.bak public/data/watchlist_kr.json 2>/dev/null || true
          }
          rm -f public/data/watchlist_kr.json.bak

      # ----------------------------------------------------------------

      # 8. 최종 결과물(JSON) 업로드
      - name: Commit and push JSONs
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # public/data (JSON 전체) + 자동 다운로드된 로고
          git add public/data/ public/logos/

          # 변경사항 확인
          if git diff --cached --quiet; then
            echo "No changes in JSONs"
            exit 0
          fi

          # 커밋
          git commit -m "chore(data): update daily JSONs & Sector & Briefing"

          # ✨ [필수] 충돌 나면 '로봇 데이터'를 우선시함!
          git pull --rebase -Xtheirs origin main

          # 최종 업로드
          git push