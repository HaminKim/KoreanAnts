name: Deploy Daily (데이터·코드 몰아서 배포)

# 데이터·코드 커밋은 scripts/vercel-ignore.sh 로 배포를 건너뛰고,
# 여기서 하루 2번 빈 커밋을 올려 그동안 쌓인 변경을 한 번에 배포한다.
on:
  schedule:
    # UTC 기준 (KST - 9시간)
    # 1. 10:30 KST (UTC 01:30) -> 01:00·06:00·09:00·10:00 매매 흐름 + 07:10 매크로 반영
    # 2. 00:30 KST (UTC 15:30) -> 15:30 매매 흐름 + 23:40 매크로 반영
    - cron: "30 1 * * *"
    - cron: "30 15 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deploy-daily
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Trigger deploy if anything changed
        run: |
          MSG="$(git log -1 --format=%s)"
          echo "HEAD: $MSG"
          # 마지막 커밋이 배포 커밋이면 그 뒤로 쌓인 변경이 없음
          case "$MSG" in
            "chore(deploy)"*|*"[deploy]"*) echo "No pending commits"; exit 0 ;;
          esac
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore(deploy): 쌓인 데이터 배포"
          git push
