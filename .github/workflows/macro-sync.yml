name: Macro Sync (FRED · Shiller · Index)

on:
  schedule:
    # UTC 기준 (KST - 9시간)
    # 1. 07:10 KST (UTC 22:10) -> 미국 정규장 마감 후: 랜딩 S&P500 / Nasdaq-100 종가 반영
    # 2. 23:40 KST (UTC 14:40) -> 미국 08:30/10:00 ET 경제지표 발표 이후: FRED 신규 발표 반영
    - cron: "10 22 * * *"
    - cron: "40 14 * * *"
  workflow_dispatch: {}
  # renewal 브랜치에서는 데이터 커밋 없이 API 키 동작만 확인
  push:
    branches: [renewal]
    paths:
      - '.github/workflows/macro-sync.yml'
      - 'scripts/macro/**'

permissions:
  contents: write

concurrency:
  group: macro-sync
  cancel-in-progress: false

jobs:
  macro:
    runs-on: ubuntu-latest
    env:
      TZ: 'Asia/Seoul'
      # 있으면 FRED 공식 API 사용(원천 갱신일 포함), 없으면 fredgraph CSV 로 동작
      FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install pandas requests yfinance xlrd

      - name: Check FRED API key
        run: python scripts/macro/check_fred_key.py

      - name: Build macro data
        if: github.event_name != 'push'
        run: python scripts/macro/build_macro.py

      - name: Commit and push
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/macro/ public/data/market/ processed/macro/
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "chore(data): update macro & landing data"
          git pull --rebase -Xtheirs origin main
          git push
